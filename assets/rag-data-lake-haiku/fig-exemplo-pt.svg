   </g>
   <g id="text_2">
    <text style="font-size: 9.8px; font-family: 'DejaVu Sans'; fill: #1f2a30" transform="translate(18.36 66.996188)">Na discussão de junho de 2025 no h3 sobre um util defineRoute, pi0 propôs um método declarativo no core</text>
    <text style="font-size: 9.8px; font-family: 'DejaVu Sans'; fill: #1f2a30" transform="translate(18.36 80.520188)">e, quatro dias depois, disse ter acabado adicionando outra coisa. O que foi adicionado?</text>
   </g>
   <g id="text_3">
    <text style="font-size: 9.4px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #1f2a30" x="18.36" y="131.610164" transform="rotate(-0 18.36 131.610164)">A) O util defineRoute no core</text>
   </g>
   <g id="text_4">
    <text style="font-weight: 700; font-size: 9.4px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #0b6b6f" x="325.26" y="131.610164" transform="rotate(-0 325.26 131.610164)">B) Uma interface de plugins de uso geral   ✔ certa</text>
   </g>
   <g id="text_5">
    <text style="font-size: 9.4px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #1f2a30" x="18.36" y="159.410211" transform="rotate(-0 18.36 159.410211)">C) Informação insuficiente no material</text>
   </g>
   <g id="text_6">
    <text style="font-size: 9.4px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #1f2a30" x="325.26" y="159.518164" transform="rotate(-0 325.26 159.518164)">D) O método app.register(spec) no core</text>
   </g>
